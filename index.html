<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="js_file.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="main-page">
      <header class="header">
        <p class="logo">Library</p>
      </header>
      <main class="books-container">
        <p class="add-books-text">Add your books</p>

        <article class="book-card">
          <div class="img-container">
            <img
              src="book-images/mercerdes-benz-f1-racing-k2 (1).jpg"
              alt="Book photo"
            />
          </div>
          <div class="book-info">
            <h2 class="book-title">Atomic Habits</h2>
            <p class="author">
              <span>Author:</span>
              <span>James Clear</span>
            </p>
            <p class="pages">
              <span>Pages:</span>
              <span>320</span>
            </p>
            <div class="card-btns">
              <button class="delete-btn">
                <svg>
                  <use href="icons/icons.svg#trash-can-icon"></use>
                </svg>
              </button>
            </div>
          </div>
        </article>

        <button
          class="add-book-btn"
          command="show-modal"
          commandfor="book-form-modal"
        >
          <svg>
            <use href="icons/icons.svg#plus-icon"></use>
          </svg>
        </button>

        <dialog id="book-form-modal" class="book-form-modal">
          <button command="close" commandfor="book-form-modal">
            <svg><use href="icons/icons.svg#close-icon"></use></svg>
          </button>
          <form class="form" action="">
            <h1>Book's info</h1>
            <div>
              <label for="book-title">Title:</label>
              <input
                id="book-title"
                name="book_title"
                type="text"
                required
                placeholder="Title"
              />
            </div>
            <div>
              <label for="book-author">Author:</label>
              <input
                id="book-author"
                name="book_author"
                type="text"
                required
                placeholder="Author"
              />
            </div>
            <div>
              <label for="book-pages">Pages:</label>
              <input
                id="book-pages"
                name="book_pages"
                type="number"
                required
                placeholder="Pages"
              />
            </div>
            <button type="submit">Add</button>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
