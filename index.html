<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="js_file.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="main-page">
      <header class="header">
        <p class="logo">Library</p>
      </header>
      <main id="books-container" class="books-container">
        <p class="add-books-text">Add your books</p>

        <template id="book-card-template" class="book-card-template">
          <article class="book-card">
            <div class="img-container">
              <img src="" alt="Book photo" />
            </div>
            <div class="book-info">
              <h2 class="book-title"></h2>
              <p class="author">
                <span>Author:</span>
                <span class="author-name"></span>
              </p>
              <p class="pages">
                <span>Pages:</span>
                <span class="number-of-pages"></span>
              </p>
              <div class="card-btns">
                <button class="status-toggle-btn"></button>
                <button class="delete-btn">
                  <svg>
                    <use href="icons/icons.svg#trash-can-icon"></use>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        </template>

        <button
          class="add-book-btn"
          command="show-modal"
          commandfor="book-form-modal"
        >
          <svg>
            <use href="icons/icons.svg#plus-icon"></use>
          </svg>
        </button>

        <dialog id="book-form-modal" class="book-form-modal">
          <button
            class="close-btn"
            command="close"
            commandfor="book-form-modal"
          >
            <svg><use href="icons/icons.svg#close-icon"></use></svg>
          </button>

          <form class="book-form" action="">
            <h2 class="book-form-title">Book's info</h2>
            <div class="form-group">
              <label for="book-title">Title:</label>
              <input
                id="book-title"
                name="book_title"
                type="text"
                required
                placeholder="Title"
              />
            </div>
            <div class="form-group">
              <label for="book-author">Author:</label>
              <input
                id="book-author"
                name="book_author"
                type="text"
                required
                placeholder="Author"
              />
            </div>
            <div class="form-group">
              <label for="book-pages">Pages:</label>
              <input
                id="book-pages"
                name="book_pages"
                type="number"
                required
                placeholder="Pages"
              />
            </div>

            <div class="form-group">
              <label for="book_image"></label>
              <input
                id="book_image"
                type="file"
                name="image"
                accept="image/*"
              />
            </div>

            <div class="form-group form-group-inline">
              <label for="book-status">Have you read it?</label>
              <input id="book-status" type="checkbox" name="book_status" />
            </div>

            <button class="submit-btn" type="submit">Add</button>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
